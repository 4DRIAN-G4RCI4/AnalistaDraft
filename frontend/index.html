<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AnalistaDraft" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#05060a" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self'; manifest-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://a.espncdn.com; connect-src 'self' ws:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>AnalistaDraft — Análisis de fútbol y parlays</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("analista-theme");
          var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();

      // Red de seguridad: si el script principal no arranca (un service worker viejo sirviendo
      // una copia que ya no existe), se borra la caché, se da de baja el worker y se recarga.
      window.addEventListener("error", function (e) {
        var src = e && e.target && e.target.src;
        if (!src || src.indexOf("/assets/") === -1) return;
        if (sessionStorage.getItem("analista-recuperando")) return; // una sola vez por sesión
        sessionStorage.setItem("analista-recuperando", "1");
        var listo = Promise.resolve();
        if (window.caches) listo = caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); });
        listo
          .then(function () {
            if (!navigator.serviceWorker) return;
            return navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); });
          })
          .catch(function () {})
          .then(function () { window.location.reload(); });
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
